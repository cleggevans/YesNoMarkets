name: ControlGraph Solana 90d exact execution

on:
  push:
    branches:
      - controlgraph-data-exec-20260907
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solana-90d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Fetch 90 daily snapshots and compute exact provider exposure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p controlgraph_sol90/raw
          cat > /tmp/run_sol90.py <<'PY'
          import csv, io, json, hashlib, time, urllib.request, urllib.error
          from collections import defaultdict, Counter
          from datetime import date, timedelta
          from pathlib import Path

          START = date(2026, 6, 8)
          END = date(2026, 9, 5)
          THRESHOLD = 1/3
          OUT = Path('controlgraph_sol90')
          RAW = OUT / 'raw'
          RAW.mkdir(parents=True, exist_ok=True)

          PROVIDER_NORMALIZATION = {
              'TeraSwitch Networks Inc.': 'TeraSwitch',
              'UAB Cherry Servers': 'Cherry Servers',
              'Latitude.sh': 'Latitude',
              'Latitude.sh LTDA': 'Latitude',
              'Allnodes Inc': 'Allnodes',
              'OVH SAS': 'OVH',
              'Servers.com  Inc.': 'Servers.com',
              'Servers.com Inc.': 'Servers.com',
              'Amazon.com  Inc.': 'Amazon',
              'Amazon.com Inc.': 'Amazon',
          }

          def fetch(url, attempts=5):
              headers = {'User-Agent':'ControlGraph-SIGMETRICS-repro/1.0'}
              last = None
              for i in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=60) as r:
                          return r.read()
                  except Exception as e:
                      last = e
                      if i + 1 < attempts:
                          time.sleep(2 ** i)
              raise RuntimeError(f'fetch failed {url}: {last}')

          def norm_provider(raw, row):
              x = (raw or '').strip()
              if x:
                  return PROVIDER_NORMALIZATION.get(x, x), True
              # Never merge unrelated unmapped validators into one fake domain.
              ident = (row.get('VotePubkey') or row.get('NodePubkey') or row.get('IP') or 'row').strip()
              return f'UNMAPPED::{ident}', False

          days = []
          d = START
          while d <= END:
              days.append(d.isoformat())
              d += timedelta(days=1)
          assert len(days) == 90

          results = []
          hash_to_dates = defaultdict(list)
          missing = []

          for idx, ds in enumerate(days, 1):
              url = f'https://raw.githubusercontent.com/iGroza/Solana-Validator-IP-Geolocation/date-{ds}/solana_validators.csv'
              print(f'[{idx:02d}/90] {ds}', flush=True)
              try:
                  payload = fetch(url)
              except Exception as e:
                  missing.append({'date':ds, 'url':url, 'error':str(e)})
                  continue

              sha = hashlib.sha256(payload).hexdigest()
              hash_to_dates[sha].append(ds)
              raw_path = RAW / f'solana_{ds}.csv'
              raw_path.write_bytes(payload)

              text = payload.decode('utf-8-sig')
              reader = csv.DictReader(io.StringIO(text))
              provider_stake = defaultdict(int)
              total_stake = 0
              mapped_stake = 0
              valid_rows = 0
              unmapped_rows = 0

              for row in reader:
                  try:
                      stake = int(row.get('ActivatedStake') or 0)
                  except Exception:
                      continue
                  if stake < 0:
                      continue
                  valid_rows += 1
                  total_stake += stake
                  provider, mapped = norm_provider(row.get('Hosting'), row)
                  provider_stake[provider] += stake
                  if mapped:
                      mapped_stake += stake
                  else:
                      unmapped_rows += 1

              if total_stake <= 0:
                  raise RuntimeError(f'no stake parsed for {ds}')

              ranked = sorted(provider_stake.items(), key=lambda kv:(-kv[1], kv[0]))
              cumulative = 0
              curve = []
              for rank, (provider, stake) in enumerate(ranked, 1):
                  cumulative += stake
                  curve.append((rank, provider, stake, cumulative/total_stake))

              e = {}
              for k in (1,2,3):
                  e[k] = sum(stake for _, stake in ranked[:k]) / total_stake
              mds = next(rank for rank, _, _, cum_share in curve if cum_share >= THRESHOLD)
              witness = [p for p,_ in ranked[:mds]]

              top10 = [
                  {'rank':i+1,'provider':p,'stake_lamports':s,'stake_share':s/total_stake}
                  for i,(p,s) in enumerate(ranked[:10])
              ]

              status = 'observed'
              note = ''
              if ds == '2026-07-02':
                  status = 'backfill'
                  note = 'Source release states this snapshot is a copy of date-2026-07-01.'

              results.append({
                  'date': ds,
                  'source_url': url,
                  'sha256': sha,
                  'status': status,
                  'source_note': note,
                  'rows': valid_rows,
                  'unmapped_rows': unmapped_rows,
                  'total_active_stake_lamports': total_stake,
                  'mapped_hosting_stake_lamports': mapped_stake,
                  'hosting_observability_coverage': mapped_stake/total_stake,
                  'top_provider': ranked[0][0],
                  'top_provider_share': ranked[0][1]/total_stake,
                  'second_provider': ranked[1][0] if len(ranked)>1 else '',
                  'second_provider_share': ranked[1][1]/total_stake if len(ranked)>1 else 0,
                  'third_provider': ranked[2][0] if len(ranked)>2 else '',
                  'third_provider_share': ranked[2][1]/total_stake if len(ranked)>2 else 0,
                  'E_L_1': e[1],
                  'E_L_2': e[2],
                  'E_L_3': e[3],
                  'MDS_L_one_third': mds,
                  'MDS_witness': witness,
                  'top10': top10,
              })

          # Strict research gate: require every day.
          if missing:
              (OUT/'solana_90d_missing.json').write_text(json.dumps(missing, indent=2), encoding='utf-8')
              raise SystemExit(f'STRICT FAILURE: missing {len(missing)} days')
          if len(results) != 90:
              raise SystemExit(f'STRICT FAILURE: got {len(results)} results')

          # Mark duplicate payloads after all hashes are known.
          duplicates = {h:ds for h,ds in hash_to_dates.items() if len(ds)>1}
          for r in results:
              peers = duplicates.get(r['sha256'], [])
              r['duplicate_dates'] = peers if len(peers)>1 else []
              if len(peers)>1 and r['status'] == 'observed':
                  r['status'] = 'duplicate'
                  r['source_note'] = f'Byte-identical payload shared with: {", ".join(peers)}'

          # Temporal deltas and transitions.
          prev = None
          transitions = []
          for r in results:
              if prev is None:
                  r['delta_E_L_1'] = None
                  r['delta_E_L_2'] = None
                  r['delta_E_L_3'] = None
                  r['MDS_transition'] = ''
              else:
                  r['delta_E_L_1'] = r['E_L_1'] - prev['E_L_1']
                  r['delta_E_L_2'] = r['E_L_2'] - prev['E_L_2']
                  r['delta_E_L_3'] = r['E_L_3'] - prev['E_L_3']
                  if r['MDS_L_one_third'] != prev['MDS_L_one_third']:
                      tr = {
                          'date':r['date'],
                          'from':prev['MDS_L_one_third'],
                          'to':r['MDS_L_one_third'],
                          'previous_date':prev['date']
                      }
                      transitions.append(tr)
                      r['MDS_transition'] = f"{tr['from']}->{tr['to']}"
                  else:
                      r['MDS_transition'] = ''
              prev = r

          fields = [
              'date','status','source_note','source_url','sha256','rows','unmapped_rows',
              'total_active_stake_lamports','hosting_observability_coverage',
              'top_provider','top_provider_share','second_provider','second_provider_share',
              'third_provider','third_provider_share','E_L_1','E_L_2','E_L_3',
              'MDS_L_one_third','MDS_witness','duplicate_dates',
              'delta_E_L_1','delta_E_L_2','delta_E_L_3','MDS_transition'
          ]
          with (OUT/'solana_90d_results.csv').open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=fields)
              w.writeheader()
              for r in results:
                  row = {k:r.get(k) for k in fields}
                  row['MDS_witness'] = '|'.join(r['MDS_witness'])
                  row['duplicate_dates'] = '|'.join(r['duplicate_dates'])
                  w.writerow(row)

          (OUT/'solana_90d_results.json').write_text(json.dumps(results, indent=2), encoding='utf-8')

          mds_counts = Counter(r['MDS_L_one_third'] for r in results)
          e1 = [r['E_L_1'] for r in results]
          e2 = [r['E_L_2'] for r in results]
          e3 = [r['E_L_3'] for r in results]
          coverage = [r['hosting_observability_coverage'] for r in results]
          moves = sorted(
              [r for r in results if r['delta_E_L_1'] is not None],
              key=lambda r: abs(r['delta_E_L_1']), reverse=True
          )[:10]
          summary = {
              'window_start':days[0], 'window_end':days[-1], 'calendar_days':len(days),
              'complete':len(results)==90 and not missing,
              'threshold':THRESHOLD,
              'status_counts':dict(Counter(r['status'] for r in results)),
              'mds_counts':{str(k):v for k,v in sorted(mds_counts.items())},
              'mds_transitions':transitions,
              'duplicate_payload_groups':duplicates,
              'E_L_1':{'min':min(e1),'max':max(e1),'mean':sum(e1)/len(e1)},
              'E_L_2':{'min':min(e2),'max':max(e2),'mean':sum(e2)/len(e2)},
              'E_L_3':{'min':min(e3),'max':max(e3),'mean':sum(e3)/len(e3)},
              'hosting_observability_coverage':{'min':min(coverage),'max':max(coverage),'mean':sum(coverage)/len(coverage)},
              'largest_abs_daily_E1_moves':[{
                  'date':r['date'],'delta_E_L_1':r['delta_E_L_1'],
                  'E_L_1':r['E_L_1'],'top_provider':r['top_provider']
              } for r in moves],
          }
          (OUT/'solana_90d_summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')

          with (OUT/'raw_hashes.csv').open('w', newline='', encoding='utf-8') as f:
              w=csv.writer(f); w.writerow(['date','sha256','source_url'])
              for r in results: w.writerow([r['date'],r['sha256'],r['source_url']])

          print(json.dumps(summary, indent=2))
          PY
          python /tmp/run_sol90.py

      - name: Upload exact outputs and raw snapshots
        uses: actions/upload-artifact@v4
        with:
          name: controlgraph-solana-90d-20260608-20260905
          path: controlgraph_sol90/
          if-no-files-found: error
          retention-days: 30
