name: ControlGraph TRON vote endpoint diagnostic

on:
  pull_request:
    branches: [main]
  push:
    branches: [controlgraph-data-exec-20260907]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test anonymous TRONSCAN vote endpoint variants
        shell: bash
        run: |
          set -u
          mkdir -p tron_diag
          CAND='TJvaAeFb8Lykt9RQcVyyTFN2iDvGMuyD4M'
          BASE='https://apilist.tronscanapi.com/api/vote'
          cat > /tmp/test.py <<'PY'
          import urllib.request, urllib.error, urllib.parse, json, os
          from pathlib import Path
          out=Path('tron_diag')
          cand='TJvaAeFb8Lykt9RQcVyyTFN2iDvGMuyD4M'
          base='https://apilist.tronscanapi.com/api/vote'
          variants=[
            ('candidate_min', {'candidate':cand,'start':'0','limit':'20'}),
            ('candidate_sort_empty', {'candidate':cand,'start':'0','limit':'20','sort':''}),
            ('candidate_sort_votes', {'candidate':cand,'start':'0','limit':'20','sort':'-votes'}),
            ('candidate_count_true', {'candidate':cand,'start':'0','limit':'20','sort':'','count':'true'}),
            ('candidate_count_1', {'candidate':cand,'start':'0','limit':'20','sort':'','count':'1'}),
            ('candidate_limit50', {'candidate':cand,'start':'0','limit':'50','sort':''}),
            ('candidate_limit200', {'candidate':cand,'start':'0','limit':'200','sort':''}),
            ('voter_doc_example', {'voter':'TWBhVFFtcuJHCgVVSx76CmVR9c6xLmDiLq','start':'0','limit':'20','sort':''}),
          ]
          summary=[]
          for name,p in variants:
            url=base+'?'+urllib.parse.urlencode(p)
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json','Referer':'https://tronscan.org/'})
            code=None; headers={}; body=b''; err=''
            try:
              with urllib.request.urlopen(req,timeout=30) as r:
                code=r.status; headers=dict(r.headers); body=r.read()
            except urllib.error.HTTPError as e:
              code=e.code; headers=dict(e.headers); body=e.read(); err=str(e)
            except Exception as e:
              code=0; err=repr(e)
            (out/f'{name}.body.txt').write_bytes(body)
            (out/f'{name}.headers.json').write_text(json.dumps(headers,indent=2,default=str),encoding='utf-8')
            text=body.decode('utf-8','replace')
            rec={'name':name,'status':code,'url':url,'error':err,'body_prefix':text[:1000]}
            summary.append(rec)
            print(json.dumps(rec,ensure_ascii=False),flush=True)
          (out/'summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False),encoding='utf-8')
          PY
          python /tmp/test.py
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: controlgraph-tron-vote-diagnostic
          path: tron_diag/
          if-no-files-found: error
          retention-days: 7
