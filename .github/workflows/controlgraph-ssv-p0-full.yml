name: ControlGraph SSV P0 Full Snapshot
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect and analyze SSV mainnet
        run: python research/controlgraph_ssv_p0_collect.py
      - uses: actions/upload-artifact@v4
        with:
          name: controlgraph-ssv-p0-full
          path: ssv_p0_full/
          if-no-files-found: error
